name: pronosticosapp
description: "Aplicación de pronósticos del clima con GetX y Clean Architecture."
publish_to: 'none'

version: 1.0.3+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.5
  lottie: ^2.3.2
  fl_chart: ^0.68.0  
  cupertino_icons: ^1.0.8
  animate_do: ^4.2.0
  intl: ^0.20.2

  
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  
  shared_preferences: ^2.2.2
  
  cached_network_image: ^3.3.1
  pdf: ^3.12.0
  printing: ^5.14.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/images/weather_icons/
    - assets/fonts/
    - assets/images/company_logos/
    - assets/animations/
